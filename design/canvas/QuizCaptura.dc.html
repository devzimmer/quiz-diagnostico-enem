<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Quiz — Captura do lead</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Kalam:wght@400;700&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Rubik',system-ui,sans-serif;color:#0B2A5B}
a{color:#0866D6}a:hover{color:#0749A8}
.papel{background-color:#FBFDFF;background-image:linear-gradient(rgba(10,127,250,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(10,127,250,.08) 1px,transparent 1px);background-size:24px 24px}
.marca{background:linear-gradient(transparent 58%,#FFE100 58%,#FFE100 92%,transparent 92%);padding:0 4px}
.campo{font:inherit;outline:none}
.campo:focus{border-color:#0A6DE6;box-shadow:0 0 0 4px rgba(10,109,230,.15)}
.cta{background:#0D8519;box-shadow:0 5px 0 #075E10;border:0;cursor:pointer;font:inherit}
.cta:hover{background:#0C7A17}
</style>
</helmet>
<div class="papel" style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 24px 28px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="QuizPergunta.dc.html" style="display: flex; align-items: center; gap: 6px; height: 44px; padding-right: 8px; color: #0866D6; font-size: 15px; font-weight: 600; text-decoration: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Revisar respostas
    </a>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #065E28; background: #C9F5D6; padding: 6px 10px; border-radius: 99px">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
      10 de 10
    </span>
  </header>

  <div style="margin-top: 28px; display: flex">
    <span style="display: inline-block; transform: rotate(-2deg); background: #FFE100; padding: 6px 12px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #0B2A5B">Último passo</span>
  </div>
  <h1 style="margin: 16px 0 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 36px; line-height: 1.08; text-transform: uppercase; color: #0B2A5B">Seu diagnóstico <span class="marca">está pronto</span></h1>
  <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.5; color: #3A4F73">Deixe seu contato para ver o resultado. Nosso time pode te chamar para montar um plano com você.</p>

  <form style="margin-top: 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nome" style="font-size: 14px; font-weight: 600">Nome completo</label>
      <input id="nome" class="campo" type="text" autocomplete="name" value="Mariana Souza" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 2px solid #DCEBFF; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #0B2A5B">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 14px; font-weight: 600">E-mail</label>
      <input id="email" class="campo" type="email" inputmode="email" autocomplete="email" value="mariana.souza@email.com" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 2px solid #DCEBFF; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #0B2A5B">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="tel" style="font-size: 14px; font-weight: 600">WhatsApp com DDD</label>
      <input id="tel" class="campo" type="tel" inputmode="tel" autocomplete="tel" value="(11) 9876-54" aria-invalid="true" aria-describedby="tel-erro" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 2px solid #D90D00; border-radius: 12px; background: #FFF6F5; font-size: 16px; color: #0B2A5B">
      <p id="tel-erro" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #B30B00">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        Informe DDD + número. Ex.: (11) 98765-4321
      </p>
    </div>
  </form>

  <div style="flex-grow: 1"></div>

  <a href="QuizResultado.dc.html" class="cta" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; border-radius: 999px; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase">
    Ver meu resultado
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
  <p style="margin: 14px 0 0; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; font-size: 12px; color: #3A4F73">
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    Seus dados ficam com a gente. Nada de spam.
  </p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
